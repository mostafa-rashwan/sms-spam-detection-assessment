[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spamdetect"
version = "0.1.0"
description = "Leakage-free SMS spam classifier with a recall-at-FPR-cap threshold policy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "scikit-learn>=1.5",
    "pandas>=2.0",
    "numpy>=1.26",
    "joblib>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dev = ["pytest>=8", "pytest-cov", "ruff", "matplotlib", "seaborn", "jupyter", "nbformat"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
